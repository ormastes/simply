description = "SPipe-prefixed full feature development alias for /dev and /sstack."
prompt = """
Run the full SPipe/SStack feature-development pipeline for the given request.

This command is equivalent to /dev and /sstack, using the SPipe-prefixed
command name for clearer namespacing.

Follow `.claude/skills/sstack.md` as the canonical procedure.

For protected PR self-review, GitHub forbids author APPROVED reviews.
SPipe Self Review Admission is a required status check, not provider/independent
approval. Ordinary code/text is default allow absent external deny/constrain;
scopes are code, text, exact file, immediate directory_files, and recursive
