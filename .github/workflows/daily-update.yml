name: daily-update
on:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - data/registry.sdn
      - data/tests.sdn
      - data/test_results.json
      - data/projects.sdn
      - data/project_observations.sdn
      - data/project_proofs/**
      - data/simple_release.sdn
      - scripts/update_site.sh
      - scripts/project_proof.sh
      - scripts/collect_project_proof.sh
      - scripts/check_worktree_clean.sh
      - scripts/update_project_observations.sh
      - test/project_provenance_showcase_test.sh
      - test/collect_project_proof_test.sh
      - test/worktree_clean_guard_test.sh
      - test/03_system/project_proof/project_provenance_showcase_spec.spl
      - .github/workflows/daily-update.yml
      - docs/glass.css
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scripts/update_site.sh reads commit times for its freshness check
      - name: Verify pristine checkout before maintenance
        run: sh scripts/check_worktree_clean.sh
      - name: Refresh test results (when a simple binary is available)
        # `simple test --json` is the ONLY source of the dashboard's numbers.
        # The pinned beta currently has no downloadable release assets, so this
        # refreshes only when `simple` is explicitly on PATH; otherwise the committed
        # data/test_results.json is used as-is and the generator decides
        # whether it is still fresh. Nothing here ever synthesises results.
        run: |
          if command -v simple >/dev/null 2>&1; then
            simple test --json > "$RUNNER_TEMP/results.json" 2>/dev/null || true
            if [ -s "$RUNNER_TEMP/results.json" ] && head -c1 "$RUNNER_TEMP/results.json" | grep -q '{'; then
              cp "$RUNNER_TEMP/results.json" data/test_results.json
            fi
          fi
      - name: Refresh public project observations
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/update_project_observations.sh
      - name: Regenerate site
        id: gen
        # The generator always writes docs/index.html — including the STALE
        # banner state — and exits non-zero when the evidence cannot be
        # trusted. The page is committed either way; the job then fails so a
        # stale dashboard is loud instead of quiet.
        run: |
          set +e
          sh scripts/update_site.sh
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Commit if changed
        run: |
          git config user.name "simply-bot"
          git config user.email "ormastespq@gmail.com"
          git add docs/index.html docs/projects.html docs/glass.css data/registry.sdn data/test_results.json data/project_observations.sdn
          git diff --cached --quiet || git commit -m "chore(site): daily regenerate from test evidence"
          git push
      - name: Fail if the generator reported stale or refused
        run: |
          rc="${{ steps.gen.outputs.rc }}"
          if [ "$rc" != "0" ]; then
            echo "::error::scripts/update_site.sh exited $rc — the dashboard is published but its evidence is stale or the generator refused to run. See the STALE section on docs/index.html."
            exit "$rc"
          fi
          echo "generator fresh (rc=0)"
  proof-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: simply
      - uses: actions/checkout@v4
        with:
          repository: ormastes/simple
          ref: v1.0.1-beta.1
          path: simple-beta
      - name: Prove portable project-proof behavior
        working-directory: simply
        run: |
          sh test/project_provenance_showcase_test.sh
          sh test/collect_project_proof_test.sh
          sh test/worktree_clean_guard_test.sh
      - name: Attempt exact-beta executable SSpec
        id: beta_sspec
        continue-on-error: true
        working-directory: simple-beta
        run: |
          test "$(git rev-parse HEAD)" = 62eada434c050cb688598bef1ab4f5a25b5cb404
          bin/simple_native --version
          SIMPLE_LIB=src bin/simple_native test "$GITHUB_WORKSPACE/simply/test/03_system/project_proof/project_provenance_showcase_spec.spl" --mode=interpreter
      - name: Record beta runtime blocker
        if: steps.beta_sspec.outcome != 'success'
        run: |
          echo "::warning::Exact-beta SSpec is blocked by ormastes/simple#497; portable behavior gates passed, but this is not beta runtime proof."
          echo "### Beta SSpec blocked" >> "$GITHUB_STEP_SUMMARY"
          echo "The exact v1.0.1-beta.1 Linux artifact fails before SSpec execution. See https://github.com/ormastes/simple/issues/497." >> "$GITHUB_STEP_SUMMARY"
